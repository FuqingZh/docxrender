name: py-publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: py-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_VENV_IN_PROJECT: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch release branch authority
        run: git fetch origin main:refs/remotes/origin/main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: python -m pip install -U pip pdm packaging twine

      - name: Install dependencies
        run: pdm sync -G dev

      - name: Run code checks
        run: |
          pdm run ruff check .
          pdm run pyright
          pdm run python -m pytest -v

      - name: Build distributions
        run: pdm build

      - name: Verify release identity and artifacts
        run: >-
          pdm run python scripts/verify_release.py
          --tag "${RELEASE_TAG}"
          --expected-commit "${GITHUB_SHA}"
          --dist dist

      - name: Check package metadata
        run: pdm run twine check dist/*

      - name: Rebuild wheel from sdist
        run: |
          mkdir -p build/sdist-wheel
          python -m pip wheel --no-deps --wheel-dir build/sdist-wheel dist/*.tar.gz

      - name: Verify wheels install and import
        run: |
          python -m venv build/wheel-smoke
          build/wheel-smoke/bin/python -m pip install -U pip
          build/wheel-smoke/bin/python -m pip install dist/*.whl
          build/wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from docxrender import DocxRenderer, convert_docx_to_pdf, write_docx

          assert version("docxrender") == "${{ github.event.release.tag_name }}"
          assert DocxRenderer().style.sizes.pt_body == 12.0
          assert callable(write_docx)
          assert callable(convert_docx_to_pdf)
          PY
          build/wheel-smoke/bin/python -m pip install --force-reinstall --no-deps build/sdist-wheel/*.whl
          build/wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from docxrender import DocxRenderer

          assert version("docxrender") == "${{ github.event.release.tag_name }}"
          assert DocxRenderer().style.sizes.pt_body == 12.0
          PY

      - name: Retain verified artifacts for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docxrender-${{ github.event.release.tag_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/docxrender
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docxrender-${{ github.event.release.tag_name }}
          path: dist

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
