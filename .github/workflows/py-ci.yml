name: py-ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  py:
    runs-on: ubuntu-latest
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: python -m pip install -U pip pdm

      - name: Install dependencies
        run: pdm sync -G dev

      - name: Show Python executable
        run: pdm run python -c "import sys; print(sys.executable)"

      - name: Lint
        run: pdm run ruff check .

      - name: Type check
        run: pdm run pyright

      - name: Type check advisory
        continue-on-error: true
        run: pdm run ty check .

      - name: Unit tests
        run: pdm run python -m pytest -v

      - name: Clean local packaging artifacts
        run: |
          rm -rf __pypackages__ .pdm-build .pytest_cache .ruff_cache dist build

      - name: Build package artifacts
        run: pdm build

      - name: Check package metadata
        run: pdm run twine check dist/*

      - name: Verify distribution identity
        run: pdm run python scripts/verify_release.py --dist dist

      - name: Install built wheel and smoke import
        run: |
          python -m venv /tmp/docxrender-wheel-venv
          /tmp/docxrender-wheel-venv/bin/python -m pip install -U pip
          /tmp/docxrender-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/docxrender-wheel-venv/bin/python - <<'PY'
          from docxrender import DocxRenderer, write_docx

          assert DocxRenderer().style.sizes.pt_body == 12.0
          assert callable(write_docx)
          print("docxrender wheel import ok")
          PY
